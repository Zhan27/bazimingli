name: Build and publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Build Windows application
        shell: pwsh
        run: |
          python -m pip install pywebview==6.2.1 pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --onefile --noconsole --name mingli-paipan --add-data '命理排盘.html;.' launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath (Resolve-Path 'dist/mingli-paipan.exe') -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Packaged application self-test failed' }
      - name: Prepare versioned assets
        shell: pwsh
        run: node scripts/package-release.cjs $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/assets/
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "$env:GITHUB_REF_NAME · 命理排盘" --notes-file release/notes.md release/assets/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
